<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UNO GPS</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      color: #20e080;
      margin-top: 15px;
    }

    .subtitle {
      text-align: center;
      color: #aab7c8;
      margin-bottom: 25px;
    }

    .card {
      background: #101d30;
      padding: 22px;
      border-radius: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #30425d;
      background: #091525;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #20e080;
      color: #06140d;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      color: #20e080;
    }

    #map {
      height: 350px;
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      overflow: hidden;
      display: none;
    }

    .coordinates {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #091525;
      border-radius: 10px;
      line-height: 1.7;
      font-family: monospace;
    }

    .warning {
      margin-top: 18px;
      font-size: 13px;
      color: #9fb0c7;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      UNO GPS
    </div>

    <div class="subtitle">
      Localização segura com autorização
    </div>

    <div class="card">

      <h2>📍 Minha localização</h2>

      <label>Número de telemóvel</label>

      <input
        type="tel"
        id="phone"
        placeholder="+244 9XX XXX XXX"
      >

      <label>E-mail</label>

      <input
        type="email"
        id="email"
        placeholder="exemplo@email.com"
      >

      <button onclick="getLocation()">
        📍 PARTILHAR MINHA LOCALIZAÇÃO
      </button>

      <div id="status"></div>

      <div id="map"></div>

      <div id="coordinates" class="coordinates"></div>

      <div class="warning">
        🔐 A localização só é obtida depois da autorização
        do utilizador. O número de telefone e o e-mail não
        permitem localizar uma pessoa secretamente.
      </div>

    </div>

  </div>


  <!-- Leaflet JavaScript -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    let map;
    let marker;

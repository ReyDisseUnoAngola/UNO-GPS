<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO GPS - Teste</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #20e080;
    }

    button {
      padding: 16px 25px;
      border: none;
      border-radius: 10px;
      background: #20e080;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 25px;
      font-size: 20px;
      color: #20e080;
    }
  </style>
</head>

<body>

  <h1>UNO GPS</h1>

  <p>Teste do sistema</p>

  <button onclick="testarBotao()">
    📍 TESTAR BOTÃO
  </button>

  <div id="resultado"></div>

  <script>
    function testarBotao() {

      document.getElementById("resultado").innerText =
        "🔥 BOTÃO FUNCIONOU! O UNO GPS está respondendo.";
    }
  </script>

</body>
</html>
